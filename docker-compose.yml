version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: go_greys_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: go_greys
    ports:
      - "5447:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: go_greys_backend
    ports:
      - "8089:8080"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=go_greys
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - JWT_SECRET=supersecretkey
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: go_greys_frontend
    ports:
      - "3006:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  backend_uploads:
